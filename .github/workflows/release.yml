name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Validate immutable release identity
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          metadata_version="$(awk '/^\/\/ @version/{print $3; exit}' JHS.user.js)"
          test "${GITHUB_REF_NAME}" = "v${version}"
          test "${metadata_version}" = "${version}"
          grep -q "^## \[${version}\]" CHANGELOG.md
          git diff --exit-code -- JHS.user.js
      - name: Reject an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: '! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1'
      - name: Extract release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '/^## \[/ { if (found) exit; if ($0 ~ "\\[" ver "\\]") found=1; next } found { print }' CHANGELOG.md > /tmp/release-body.md
          test -s /tmp/release-body.md
      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" JHS.user.js --verify-tag --title "JHS ${GITHUB_REF_NAME#v}" --notes-file /tmp/release-body.md --latest
